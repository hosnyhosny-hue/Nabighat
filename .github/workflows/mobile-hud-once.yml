name: Prepare verified mobile HUD 2.2.3
on:
  push:
    branches: [fix/mobile-hud-223]
    paths: [.github/workflows/mobile-hud-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'hosnyhosny-hue/Nabighat'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply deterministic Unicode edits with input and output integrity checks
        shell: python
        env:
          PATCH: >-
            
        run: |
          import base64, hashlib, json, os, pathlib, zlib
          path = pathlib.Path('index.html')
          original = path.read_bytes()
          expected_in = '9c4f548e7dbe948d150d8f6caed5159056d225151e9ae9cb203ada589b36f36b'
          expected_out = '548eb0097ca4239269f86246598f9dabbd2ab8be90a6130ce71347b5de2993e6'
          assert hashlib.sha256(original).hexdigest() == expected_in, 'Input changed: stop, do not overwrite'
          text = original.decode('utf-8')
          edits = json.loads(zlib.decompress(base64.b64decode(os.environ['PATCH'], validate=True)))
          assert len(edits) == 73
          previous = 0
          for start, end, replacement in edits:
              assert type(start) is int and type(end) is int and isinstance(replacement, str)
              assert previous <= start <= end <= len(text)
              previous = end
          for start, end, replacement in reversed(edits):
              text = text[:start] + replacement + text[end:]
          result = text.encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == expected_out, 'Output mismatch: stop'
          path.write_bytes(result)
          print('Verified input 2.2.2 and exact tested output 2.2.3; updated index.html only.')
      - name: Parse every inline script
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          let count = 0;
          for (const match of blocks) {
            if (/type=["']application\/json/.test(match[0].split('>')[0])) continue;
            new Function(match[1]); count++;
          }
          console.log(`Parsed ${count} JavaScript blocks.`);
          JS
      - name: Commit the tested page and remove this one-time preparation workflow
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'fix/mobile-hud-223'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/mobile-hud-once.yml
          git commit -m 'Fix mobile HUD: compact panels and touch answer dock (2.2.3)'
          git push origin HEAD:refs/heads/fix/mobile-hud-223
